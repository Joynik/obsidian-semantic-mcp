name: Build macOS binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install build and test dependencies
        run: uv sync --locked --python 3.14 --group build

      - name: Check release version and architecture
        run: |
          version="$(uv run --no-sync python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          test "$(uname -m)" = arm64
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi

      - name: Run checks
        run: |
          uv run --no-sync ruff check osm_cli.py src
          uv run --no-sync ruff format --check osm_cli.py src
          uv run --no-sync ty check osm_cli.py src
          uv run --no-sync pytest -q

      - name: Build and package standalone executable
        env:
          COPYFILE_DISABLE: "1"
        run: |
          uv run --no-sync python binary-build/build.py
          binary-build/output/osm.dist/osm help > /dev/null
          version="$(uv run --no-sync python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          mkdir -p binary-build/release
          tar -czf "binary-build/release/osm-v${version}-macos-arm64.tar.gz" \
            -C binary-build/output osm.dist -C "$GITHUB_WORKSPACE" LICENSE

      - uses: actions/upload-artifact@v7
        with:
          name: osm-macos-arm64
          path: binary-build/release/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: osm-macos-*
          merge-multiple: true
          path: dist

      - name: Publish release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          test -f "osm-${GITHUB_REF_NAME}-macos-arm64.tar.gz"
          gh release create "$GITHUB_REF_NAME" \
            "osm-${GITHUB_REF_NAME}-macos-arm64.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "OSM $GITHUB_REF_NAME" \
            --notes "macOS binaries for Homebrew."
